<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Northwind · 夹具样张</title>
    <link rel="icon" href="data:,">

    <!-- 令牌先于基础样式：base.css 只消费 token -->
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="base.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主内容</a>

    <div class="app" data-rail="expanded" id="app">
      <header class="topbar">
        <div class="topbar__brand">
          <span class="brand-mark" aria-hidden="true">NW</span>
          <span class="brand-text">
            <strong data-brand-name>Northwind</strong>
            <span data-brand-sub>运营控制台</span>
          </span>
        </div>

        <label class="topbar__search">
          <span class="visually-hidden">搜索</span>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="6.2"></circle>
            <path d="m16 16 4 4"></path>
          </svg>
          <input type="search" data-search placeholder="搜索活动、成员或报表…" autocomplete="off">
        </label>

        <span class="topbar__spacer"></span>

        <div class="topbar__meta">
          <span class="timer">
            <span class="timer__label" data-timer-label>本次会话已进行</span>
            <span class="timer__value" data-timer role="timer" aria-live="off">00:00:00</span>
          </span>
          <button class="btn btn--sm" data-variant="ghost" type="button" data-theme-toggle aria-pressed="false">
            <span class="btn__label" data-theme-label>深色</span>
          </button>
        </div>

        <div class="topbar__actions">
          <button class="btn btn--sm" data-variant="ghost" type="button" aria-label="通知">
            <span class="badge" data-tone="danger">3</span>
          </button>
          <button class="btn btn--sm" data-variant="secondary" type="button" data-action="export">
            <span class="btn__label">导出报表</span>
          </button>
          <button class="btn btn--sm" data-variant="primary" type="button" data-action="new">
            <span class="btn__label">新建活动</span>
          </button>
        </div>
      </header>

      <nav class="rail" aria-label="主导航" id="rail">
        <div class="rail__head">
          <span class="rail__label">工作区</span>
          <button class="rail__toggle" type="button" data-rail-toggle aria-expanded="true" aria-controls="rail" aria-label="折叠侧栏">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m14 6-6 6 6 6"></path>
            </svg>
          </button>
        </div>

        <ul class="nav" data-nav></ul>

        <div class="rail__foot">
          <span class="msg__avatar" aria-hidden="true">林</span>
          <span class="rail__foot-text">
            <strong>林知远</strong>
            <span>管理员 · 产品设计组</span>
          </span>
        </div>
      </nav>

      <main class="main" id="main" tabindex="-1" data-main>
        <noscript>
          <p>这个夹具需要启用 JavaScript 才能渲染视图。</p>
        </noscript>
      </main>
    </div>

    <div class="visually-hidden" aria-live="polite" data-route-announce></div>

    <!--
      file:// 提示：Chrome / Edge / Firefox 会以 CORS 为由拦截 file:// 下的
      ES module（"origin 'null' has been blocked by CORS policy"）。这是浏览器
      策略，不是 import 路径问题。夹具坚持原生 ESM，因此不内联打包；
      直接双击打开时给出可执行的下一步，而不是白屏。
      在站点根目录运行：node -e "…http server…" 或任意静态服务器。
    -->
    <script>
      (function () {
        if (location.protocol !== "file:") return;
        var show = function () {
          if (window.__fixture) return;
          var main = document.querySelector("[data-main]");
          if (!main) return;
          main.innerHTML =
            '<div class="state-panel" data-tone="error" style="margin:24px auto;max-width:640px">' +
            '<span class="state-panel__art"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 3 20h18L12 4Z"/><path d="M12 10v4.5"/></svg></span>' +
            "<h3>需要通过本地服务器打开</h3>" +
            "<p>浏览器禁止 <code>file://</code> 加载 ES module，与本夹具的代码无关。在任何静态服务器下打开即可，例如：</p>" +
            '<p class="state-panel__code">node -e "require(\'http\').createServer((q,s)=>require(\'fs\').createReadStream(require(\'path\').join(\'.\',q.url===\'/\'?\'index.html\':q.url)).on(\'error\',()=>s.writeHead(404).end()).pipe(s)).listen(4318)"</p>' +
            "<p>然后访问 <code>http://127.0.0.1:4318/</code>。</p>" +
            "</div>";
        };
        window.addEventListener("error", function (e) {
          if (e.target && e.target.tagName === "SCRIPT") show();
        }, true);
        window.addEventListener("load", function () {
          setTimeout(show, 400);
        });
      })();
    </script>
  </body>
</html>
